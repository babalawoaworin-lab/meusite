<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minha Franquia</title>

<style>
body{
margin:0;
font-family:Arial, sans-serif;
background:#111;
color:white;
text-align:center;
}

.hero{
padding:100px 20px;
background:linear-gradient(135deg,#000,#222);
}

h1{
font-size:40px;
margin-bottom:20px;
}

.botao{
background:#00ff88;
color:black;
padding:15px 30px;
text-decoration:none;
font-weight:bold;
border-radius:8px;
display:inline-block;
margin-top:20px;
}

.secao{
padding:60px 20px;
}

.formulario{
background:#222;
padding:40px;
border-radius:10px;
max-width:400px;
margin:0 auto;
}

input{
width:100%;
padding:10px;
margin:10px 0;
border:none;
border-radius:5px;
}

button{
background:#00ff88;
border:none;
padding:15px;
width:100%;
font-weight:bold;
border-radius:5px;
cursor:pointer;
}
</style>
</head>

<body>

<div class="hero">
<h1>Seja Dono do Seu Próprio Negócio</h1>
<p>Modelo validado, suporte completo e alta lucratividade.</p>
<a href="#contato" class="botao">Quero Saber Mais</a>
</div>

<div class="secao">
<h2>Por que investir?</h2>
<p>✔ Modelo testado<br>
✔ Baixo investimento inicial<br>
✔ Alto retorno financeiro</p>
</div>

<div class="secao" id="contato">
<h2>Receba Mais Informações</h2>

<div class="formulario">
<form>
<input type="text" placeholder="Seu nome" required>
<input type="email" placeholder="Seu e-mail" required>
<input type="text" placeholder="Seu WhatsApp" required>
<button type="submit">Enviar</button>
</form>
</div>

</div>

</body>
</html>
